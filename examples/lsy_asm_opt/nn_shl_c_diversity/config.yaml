max_iterations: 30
checkpoint_interval: 5
file_suffix: .s
llm:
  primary_model: DeepSeek-V3.2
  primary_model_weight: 1.0
  secondary_model_weight: 0.0
  api_base: https://llmapi.paratera.com
  temperature: 0.7
  max_tokens: 4096
  timeout: 180
prompt:
  system_message: "You are an expert in AArch64 assembly optimization.\nYour task\
    \ is to generate diverse alternative implementations of the given program.\nThe\
    \ variant MUST be 100% functionally equivalent with correctness_score = 1.0(exact\
    \ same input \u2192 exact same output).\nPerformance should not degrade significantly\
    \ compared to the original \u2014 minor slowdowns are acceptable if they enable\
    \ substantially different structure, but improvements are also welcome.\nPrioritize\
    \ radical diversity in implementation style while maintaining correctness.\n"
  use_template_stochasticity: true
  template_variations:
    greeting:
    - 'Create a structurally very different variant of this program (must remain fully
      correct):'
    - 'Produce an alternative implementation with substantially altered control flow
      and register usage:'
    - 'Rewrite using a completely different organization and style, preserving exact
      semantics:'
    - 'Generate a diverse equivalent version with changed dependency chains and branching
      patterns:'
    - 'Provide a restructured variant with noticeable differences in overall approach
      (must be correct):'
    improvement_suggestion:
    - 'Maximize structural diversity: vary control flow graph, basic block count,
      loop nesting depth, branch density, and register allocation patterns'
    - "Rearrange instructions, modify register pressure, or reshape data dependencies\
      \ \u2014 minor performance changes are acceptable if the structure becomes significantly\
      \ different"
    - Aim for large differences in implementation strategy (e.g. different loop forms,
      varied register spilling, alternative memory access patterns) while ensuring
      correctness
    - Experiment with register usage sparsity, dependency chain restructuring, or
      different parallelism opportunities; small perf improvements or trade-offs are
      fine for diversity
    - "Focus on structural novelty: different nesting levels, more/fewer jumps, changed\
      \ register-to-memory balance, or novel instruction sequencing \u2014 keep it\
      \ correct and reasonably efficient"
  num_top_programs: 3
  num_diverse_programs: 3
  include_artifacts: true
database:
  population_size: 200
  archive_size: 60
  num_islands: 4
  migration_interval: 15
  elite_selection_ratio: 0.15
  exploitation_ratio: 0.6
  feature_dimensions:
  - diversity
  - better_than_base_avg_position
  feature_bins:
    better_than_base_avg_position: 5
    diversity: 8
  similarity_threshold: 0.94
evaluator:
  timeout: 180
  cascade_evaluation: false
  parallel_evaluations: 3
diff_based_evolution: true
max_code_length: 20000
